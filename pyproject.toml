[project]
name = "nm-memory-layer"
version = "0.1.0"
description = "Standalone memory layer for AI agents: SQLite + FTS5 session store (Hermes-style episodic memory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0.0",
    "langchain-openai>=1.6.2",
    "nm-skills-registry",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
nm-skills-registry = { git = "https://github.com/trgordonb/nm-skills-registry", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nm_memory_layer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
wiki-hybrid = ["fastembed>=0.8.0", "sqlite-vec>=0.1.9", "numpy>=1.26"]
